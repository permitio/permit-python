# Run by prek (see CONTRIBUTING.md). `language: system` runs a command from the
# environment prek was started in.
#
# An older prek, such as an old global install, stops with an error here rather
# than running the hooks differently.
minimum_prek_version: "0.5.3"

repos:
  # Pinned to a commit rather than a tag, which can be moved; the `# frozen:`
  # comment names the release, and Dependabot updates both.
  #
  # `language: python` makes prek run that release's hooks. Without it, prek
  # runs its own Rust versions of them, which differ on some inputs: check-yaml
  # accepts unknown tags, check-toml accepts TOML 1.1, check-json accepts an
  # empty file, and others.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        language: python
      - id: end-of-file-fixer
        language: python
      - id: check-added-large-files
        language: python
      - id: check-case-conflict
        language: python
      - id: check-executables-have-shebangs
        language: python
      - id: check-shebang-scripts-are-executable
        language: python
      - id: check-json
        language: python
      - id: check-toml
        language: python
      - id: check-yaml
        language: python
      - id: check-xml
        language: python
      - id: check-merge-conflict
        language: python
      - id: mixed-line-ending
        language: python
        args: [--fix=lf]

  # ruff, mypy and typos run from the project environment, so the versions in
  # uv.lock (the `dev` dependency group) are the only ones there are, and mypy
  # sees the SDK's real dependencies. `uv run --locked` first syncs .venv to
  # uv.lock (default groups, so the tools are always installed there and a copy
  # elsewhere on PATH is never picked up) and fails if uv.lock is stale.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        # pyproject.toml too: ruff validates its [project] table (RUF200).
        files: (\.pyi?|(^|/)pyproject\.toml)$
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        # No file names: mypy checks the `files` set in pyproject.toml as a whole,
        # which is what makes cross-module errors visible.
        entry: uv run --locked mypy
        language: system
        # pyproject.toml and uv.lock too: they hold mypy's config and the
        # dependency versions it checks against.
        files: (\.pyi?|^pyproject\.toml|^uv\.lock)$
        pass_filenames: false
        require_serial: true
      - id: typos
        name: typos
        entry: uv run --locked typos --force-exclude
        language: system
        types: [text]
        require_serial: true

  # Fails when pyproject.toml and uv.lock disagree; run `uv lock` to fix. It runs
  # the uv on PATH rather than installing its own, so there is no second uv
  # version to keep in step with the dev group's `uv` pin. Under `uv run` (as in
  # CI) that is the pinned uv from .venv/bin. --check never writes, so a local uv
  # too old to read [tool.uv] fails here instead of re-locking with other settings.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false
