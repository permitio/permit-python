repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [ --fix=lf ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$
        types: [ file ]
      - id: ruff-format
        files: \.py$
        types: [ file ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
          - pydantic
        files: \.py$
        types: [ file ]

  # Fails when pyproject.toml and uv.lock disagree; run `uv lock` to fix. It runs
  # the uv on PATH rather than installing its own, so there is no second uv
  # version to keep in step with the dev group's `uv` pin. Under `uv run` (as in
  # CI) that is the pinned uv from .venv/bin. --check never writes, so a local uv
  # too old to read [tool.uv] fails here instead of re-locking with other settings.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: unsupported
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false
