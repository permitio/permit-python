# Configuration for the CI script tests alone (format_audit.py and
# check_schema_drift.py), passed with -c so pytest does not use the SDK's
# configuration in pyproject.toml ([tool.pytest]), whose testpaths and
# asyncio_mode belong to the SDK's suite. These tests need only pytest and the
# standard library, and warn about nothing: any warning is an error.
[pytest]
# strict_config, strict_markers, strict_xfail and strict_parametrization_ids.
strict = true
filterwarnings = error
