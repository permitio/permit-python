version: 2
updates:
  # Python dependencies: pyproject.toml ([project].dependencies and the
  # dependency groups) plus uv.lock, which Dependabot re-locks in the same PR.
  #
  # Consumers never see uv.lock -- this package publishes open `>=` ranges --
  # so a Dependabot PR here raises the *floor* consumers are allowed to install
  # on, not just the version CI happens to resolve. That is the whole point:
  # the floor is the exposure, and the audit gate in security.yml scans it
  # explicitly. pydantic's floors are the exception: they are kept by hand
  # (see `ignore` below).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # REQUIRED, not cosmetic. Left at `auto`, Dependabot may classify this
    # published package as a library and default to `widen`, which only
    # relaxes upper bounds and would never raise a `>=` floor -- so the
    # automation would silently never do the one thing this file exists to
    # do. `increase` raises the lower bound instead (and moves the exact `==`
    # pins in the dev group).
    versioning-strategy: increase
    # Wait 7 days before proposing a release, 14 for a major. A brand-new
    # version is the window in which a compromised or yanked package is most
    # likely to still be live, and nothing here is urgent enough to need
    # day-zero adoption. Security updates are exempt from this cooldown, but
    # the `uv lock` Dependabot runs still applies exclude-newer = "7 days" from
    # pyproject.toml, so a fix released less than 7 days ago cannot be locked
    # and its update fails until the release is 7 days old. To take such a fix
    # sooner, lock it by hand with an exclude-newer-package entry (see
    # CONTRIBUTING.md, "Dependencies").
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # pydantic is updated by hand, for every update type. The SDK supports
      # both majors on purpose (permit/utils/pydantic_version.py), and
      # [project].dependencies has one pydantic line per Python range, with
      # floors and `!=` exclusions whose reasons are in the comments there.
      # Dependabot cannot keep those lines correct:
      # - it skips a requirement whose marker contains `<`, so the
      #   python_version < "3.13" line would never be updated;
      # - on the lines it does update, it rewrites each `!=X.Y.*` exclusion as
      #   `!=X.Y.0.dev`, which lets the X.Y releases back in (as PR #130 did to
      #   the old requirements.txt);
      # - a major bump would drop pydantic 1 support.
      # An ignore with no update-types also stops Dependabot security updates
      # for pydantic. The audit gate in security.yml scans the newest pydantic
      # and its pydantic 1 and pydantic 2 floors (resolved for Python 3.10), and
      # fails on a fixable advisory. The pydantic versions in uv.lock move with
      # `uv lock --upgrade-package pydantic`.
      #
      # Removal gate: drop this entry once pydantic is one requirement with no
      # `!=` exclusions and no `<` marker.
      - dependency-name: "pydantic"
      # uv_build, the build backend in [build-system], is updated by hand
      # together with the uv version and checksum that python-sdk-publish.yml's
      # build job pins. That uv builds releases with its own built-in backend
      # only while the uv_build bound allows its version. A Dependabot PR that
      # raised the bound past it would make release builds download uv_build
      # from PyPI instead, around the checksum-verified binary, and nothing
      # would fail.
      - dependency-name: "uv_build"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"

  # GitHub Actions versions.
  # Note: cooldown.semver-major-days is not supported for github-actions --
  # Dependabot only honours it on semver-strict ecosystems like uv and npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"
