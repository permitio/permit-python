version: 2
updates:
  # Python dependencies: pyproject.toml ([project].dependencies and the
  # dependency groups) plus uv.lock, which Dependabot re-locks in the same PR.
  #
  # Consumers never see uv.lock -- this package publishes open `>=` ranges --
  # so a Dependabot PR here raises the *floor* consumers are allowed to install
  # on, not just the version CI happens to resolve. That is the whole point:
  # the floor is the exposure, and the audit gate in security.yml scans it
  # explicitly.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # REQUIRED, not cosmetic. Left at `auto`, Dependabot may classify this
    # published package as a library and default to `widen`, which only
    # relaxes upper bounds and would never raise a `>=` floor -- so the
    # automation would silently never do the one thing this file exists to
    # do. `increase` raises the lower bound instead (and moves the exact `==`
    # pins in the dev group).
    versioning-strategy: increase
    # Matches the agent-security policy: wait 7 days before proposing a
    # release, 14 for a major. A brand-new version is the window in which a
    # compromised or yanked package is most likely to still be live, and
    # nothing here is urgent enough to need day-zero adoption. Security
    # updates are exempt from cooldown by Dependabot and still arrive
    # immediately.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # Listed first, since a dependency joins the first group it matches. A new
      # lint rule or type-check error in one of these must not hold up the
      # runtime floor bumps grouped below, so they get a PR of their own.
      lint-tools:
        patterns: ["ruff", "mypy", "typos"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # pydantic is dual-supported on purpose: permit/utils/pydantic_version.py
      # branches on PYDANTIC_VERSION and every model imports from either
      # `pydantic` (v1) or `pydantic.v1` (v2 compat shim). A Dependabot major
      # bump cannot reason about that and would silently propose dropping v1
      # support, so majors are handled by hand. Minor/patch still flow through.
      #
      # Removal gate: drop this entry once the SDK stops supporting pydantic v1.
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"

  # pre-commit hook revisions in .pre-commit-config.yaml. Dependabot follows the
  # `# frozen: vX` comment on SHA-pinned revs and rewrites the SHA and the
  # comment together. `repo: local` hooks (ruff, mypy, typos) are skipped:
  # their versions come from uv.lock, which the "uv" entry above maintains.
  # Only `default-days` cooldown is supported for this ecosystem.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The uv-lock hook's version must equal [tool.uv] required-version in
      # pyproject.toml; uv is upgraded by hand, all three places at once.
      - dependency-name: "*astral-sh/uv-pre-commit"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # GitHub Actions versions.
  # Note: cooldown.semver-major-days is not supported for github-actions --
  # Dependabot only honours it on semver-strict ecosystems like uv and npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"
