name: Security

# The weekly and manual dependency audit. Pull requests and pushes to main run
# the same audit (.github/actions/dependency-audit) in test.yml.
on:
  # Weekly sweep. A dependency set that was clean when it merged does not stay
  # clean -- advisories are published against versions that already shipped, so
  # without a scheduled re-scan the gate only ever sees a tree at the moment it
  # changed. Results go to Slack.
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}

# Read-only. Neither job writes to the repository; Slack is reached through
# its own webhook secret.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    # Read-only ON PURPOSE: `uv pip compile` builds an sdist to read its
    # metadata for any dependency without a wheel, which runs that package's
    # setup.py on the runner (see the audit job in test.yml).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .github/actions/dependency-audit holds the audit's steps. It is a
      # local action, so it runs from the checkout above. zizmor asks for the
      # self-repository syntax ($/...) instead of ./, which actionlint (v1.7.12)
      # rejects.
      - name: Dependency audit
        uses: ./.github/actions/dependency-audit # zizmor: ignore[self-repository]
        with:
          python-version: ${{ env.PYTHON_VERSION }}

  # Weekly only. A scheduled run has no PR to comment on, so Slack is the only
  # channel that reaches a person -- which is why it carries the findings
  # themselves (packages, counts, upgrade targets) rather than just a verdict.
  notify:
    name: Notify Slack
    runs-on: ubuntu-24.04
    needs: [audit]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    env:
      # The secrets context is not available in a job-level `if:`, so the
      # webhook is read into the environment here and the steps below gate on
      # whether it is actually set.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      # A fork, or any repository without SLACK_WEBHOOK_URL, gets a warning
      # here instead of a failed job, so a missing webhook reads as
      # unconfigured rather than as a broken weekly audit.
      - name: Check Slack webhook is configured
        id: check
        run: |
          set -uo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning title=Slack not configured::SLACK_WEBHOOK_URL is not set on this repository, so the weekly audit result was not posted. Add the secret to enable notifications."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Rebuilding the message from the audit job's own artifact keeps all the
      # Slack escaping inside the unit-tested renderer, rather than
      # interpolating scanner output into the workflow's payload block.
      # NODE_OPTIONS: see the download step of test.yml's comment job.
      - name: Download audit artifacts
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: dependency-audit
          path: /tmp/audit

      - name: Render Slack message
        id: slack
        if: steps.check.outputs.configured == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -uo pipefail
          {
            echo "text<<SLACK_EOF"
            if [ ! -f /tmp/audit/trivy-runtime-ceiling.json ]; then
              # The audit job never produced a report. Say so plainly rather
              # than rendering a message that would imply a clean tree.
              echo ":warning: *${REPO} - weekly dependency audit did not complete*"
              echo ">Result: ${AUDIT_RESULT}. No scan report was produced, so a clean history is not evidence of a clean tree."
              echo ">${RUN_URL}"
            else
              python .github/scripts/format_audit.py \
                "runtime-ceiling=/tmp/audit/trivy-runtime-ceiling.json" \
                "runtime-floor=/tmp/audit/trivy-runtime-floor.json" \
                "runtime-floor-pydantic-v2=/tmp/audit/trivy-runtime-floor-pydantic-v2.json" \
                "dev-ceiling=/tmp/audit/trivy-dev-ceiling.json" \
                --pip-audit "runtime-ceiling=/tmp/audit/pip-audit-runtime-ceiling.json" \
                --pip-audit "runtime-floor=/tmp/audit/pip-audit-runtime-floor.json" \
                --pip-audit "runtime-floor-pydantic-v2=/tmp/audit/pip-audit-runtime-floor-pydantic-v2.json" \
                --pip-audit "dev-ceiling=/tmp/audit/pip-audit-dev-ceiling.json" \
                --slack \
                --repo "${REPO}" \
                --run-url "${RUN_URL}"
            fi
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: steps.check.outputs.configured == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # toJSON quotes and escapes the rendered text, so advisory content
          # cannot break out of the payload.
          payload: |
            text: ${{ toJSON(steps.slack.outputs.text) }}
