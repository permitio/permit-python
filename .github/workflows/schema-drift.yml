name: Schema Drift

# Compares permit/api/models.py with models generated from the live API schema
# (https://api.permit.io/v2/openapi.json) by `make generate-models`'s pinned
# generator. .github/scripts/check_schema_drift.py compares the two by structure:
# a difference that makes the SDK send what the API rejects, or reject what it
# returns, fails the job; a class or optional field the SDK lacks is only listed
# in the job summary. Known differences live in
# .github/scripts/schema_drift_allowlist.json, one reason each; an entry that no
# longer matches fails the job until it is removed. The comment above
# generate-models in the Makefile says how to run the check locally.
#
# A scheduled run that finds new drift, or that cannot run, posts the counts and
# a link to Slack, and so does every manual run; the differences themselves are
# in the job summary.
#
# NOT a required status check, on purpose. The pull_request trigger below is
# path-filtered, and GitHub leaves a required check that never runs pending
# forever, which would block every PR that does not touch these paths. The check
# also depends on a live external schema, which can change without any change to
# this repository.
on:
  pull_request:
    paths:
      - "permit/api/models.py"
      - ".github/scripts/check_schema_drift.py"
      - ".github/scripts/schema_drift_allowlist.json"
      - ".github/workflows/schema-drift.yml"
  # The API schema changes without a PR here, so only a scheduled run notices.
  # Results go to Slack.
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    name: Schema Drift
    runs-on: ubuntu-24.04
    # The script gives the schema download three 60s attempts and the generator
    # 10 minutes; this also bounds the setup steps.
    timeout-minutes: 20
    outputs:
      exit: ${{ steps.check.outputs.exit }}
      failing: ${{ steps.check.outputs.failing }}
      informational: ${{ steps.check.outputs.informational }}
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The script runs the pinned model generator through uvx.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"

      # Exit 1 is new drift or a stale allowlist entry; exit 2 means the
      # comparison did not run. Both fail the job; the summary says which.
      - name: Compare models with the API schema
        id: check
        run: |
          set -uo pipefail
          set +e
          python .github/scripts/check_schema_drift.py \
            --models permit/api/models.py \
            --allowlist .github/scripts/schema_drift_allowlist.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"
          check_exit=$?
          set -e
          echo "exit=${check_exit}" >> "$GITHUB_OUTPUT"
          if [ "${check_exit}" -eq 1 ]; then
            echo "::error title=API schema drift::permit/api/models.py differs from the API schema in a way the allowlist does not cover. See the job summary."
          elif [ "${check_exit}" -ne 0 ]; then
            echo "::error title=Schema drift check did not run::The comparison did not complete, so there is no result. See the log."
          fi
          exit "${check_exit}"

  # A scheduled run has no PR to report on, so Slack is the only channel that
  # reaches a person; it posts only when the run did not pass. A manual run
  # always posts, pass or fail, so the Slack path can be tried on demand. The
  # message carries counts and a link; the differences themselves are in the
  # job summary.
  notify:
    name: Notify Slack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [drift]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && needs.drift.result != 'success')
      )
    env:
      # The secrets context is not available in a job-level `if:`, so the
      # webhook is read into the environment here and the steps below gate on
      # whether it is actually set.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      # A fork, or any repository without SLACK_WEBHOOK_URL, gets a warning
      # here instead of a failed job.
      - name: Check Slack webhook is configured
        id: check
        run: |
          set -uo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning title=Slack not configured::SLACK_WEBHOOK_URL is not set on this repository, so the schema drift result was not posted. Add the secret to enable notifications."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render Slack message
        id: slack
        if: steps.check.outputs.configured == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          CHECK_EXIT: ${{ needs.drift.outputs.exit }}
          FAILING: ${{ needs.drift.outputs.failing }}
          INFORMATIONAL: ${{ needs.drift.outputs.informational }}
          STALE: ${{ needs.drift.outputs.stale }}
        run: |
          set -uo pipefail
          {
            echo "text<<SLACK_EOF"
            if [ "${CHECK_EXIT:-}" = "0" ]; then
              echo ":white_check_mark: *${REPO} - API schema drift check passed*"
              echo ">permit/api/models.py matches the API schema apart from allowlisted differences. ${INFORMATIONAL:-0} new informational."
            elif [ "${CHECK_EXIT:-}" = "1" ]; then
              echo ":warning: *${REPO} - API schema drift*"
              echo ">permit/api/models.py differs from the API schema: ${FAILING:-0} new failing difference(s), ${STALE:-0} stale allowlist entry(ies), ${INFORMATIONAL:-0} new informational."
            else
              echo ":warning: *${REPO} - API schema drift check did not complete*"
              echo ">The comparison did not run, so there is no result."
            fi
            echo ">${RUN_URL}"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: steps.check.outputs.configured == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # toJSON quotes and escapes the rendered text for the payload.
          payload: |
            text: ${{ toJSON(steps.slack.outputs.text) }}
