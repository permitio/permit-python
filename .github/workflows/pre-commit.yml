name: pre-commit

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      # Hook environments, keyed on the config that defines them and on the
      # Python they were built with, since a hook venv does not survive an
      # interpreter change. This is the cache pre-commit/action used to provide.
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-py${{ steps.setup-uv.outputs.python-version }}-${{
            hashFiles('.pre-commit-config.yaml') }}

      # The ruff, mypy and typos hooks run from this environment (they are
      # `repo: local`), and mypy needs the SDK's dependencies to check against,
      # so the whole locked project is installed, pydantic 2 included.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit
        run: >-
          uv run --no-sync
          pre-commit run --all-files --show-diff-on-failure --color=always

      # The SDK imports pydantic differently per major, so its types are checked
      # against pydantic 1 as well (the hook above ran against pydantic 2). mypy
      # is called directly with --no-sync, not through the hook: the hook's
      # `uv run --locked` would sync .venv back to the default groups (pydantic 2).
      - name: Type-check against pydantic 1
        run: |
          uv sync --locked --group pydantic-v1
          uv run --no-sync mypy
