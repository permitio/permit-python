name: pre-commit

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  # The job id is the required status check "pre-commit" on main; keep it.
  #
  # prek runs the hooks in .pre-commit-config.yaml. It comes from uv.lock rather
  # than j178/prek-action, so CI runs the version developers run, Dependabot's
  # uv updates move it, and the dependency audit scans it.
  pre-commit:
    runs-on: ubuntu-24.04
    env:
      # Where prek keeps cloned hook repositories and hook environments. Set
      # here so prek and the cache step below use the same path.
      PREK_HOME: ~/.cache/prek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: "3.11"
          enable-cache: true

      # Hook environments, keyed on the config that defines them, on uv.lock,
      # which pins prek and the uv that builds them, and on the Python they were
      # built with, since a hook venv does not survive an interpreter change.
      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PREK_HOME }}
          key: >-
            prek-${{ runner.os }}-py${{ steps.setup-uv.outputs.python-version }}-${{
            hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      # prek itself needs only the locked dev group. The ruff, mypy and typos
      # hooks are `repo: local` and run through `uv run --locked`, which syncs
      # .venv to the default groups first: the project, its dependencies
      # (pydantic 2) and the dev tools, so mypy checks against the SDK's real
      # dependencies.
      - name: Run prek
        run: >-
          uv run --locked --only-dev
          prek run --all-files --show-diff-on-failure --color=always

      # The SDK imports pydantic differently per major, so its types are checked
      # against pydantic 1 as well (the hook above ran against pydantic 2).
      - name: Type-check against pydantic 1
        run: uv run --locked --group pydantic-v1 mypy
