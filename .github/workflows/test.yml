name: Test
on:
  # Every PR, whatever its base: a stacked PR, whose base is another PR's
  # branch, gets the full suite before it merges. No path filter: GitHub
  # leaves a required check that never runs pending, which blocks the PR.
  pull_request:
  # Every merge to main runs everything too, the dependency audit included,
  # so a regression shows as a failed run on main rather than on the next PR.
  # No PR comment is posted on push; the job summaries carry the detail.
  push:
    branches:
      - main
      - master

# Least privilege: read-only by default. Nothing in this workflow writes to the
# repository; the Permit API calls authenticate with their own secret, not
# GITHUB_TOKEN. pull-requests: write is granted per job, only to the two jobs
# that post on the PR: the audit comment and dependency review.
permissions:
  contents: read

env:
  # The Python the dependency audit and its scripts' tests run on.
  PYTHON_VERSION: "3.11"
  PROJECT_ID: 7f55831d77c642739bc17733ab0af138 #github actions project id (under 'Permit.io Tests' workspace)
  ENV_NAME: python-sdk-ci
  # The PDP the `pytest` jobs run against, pinned by version and by the digest
  # of that version's multi-arch image index, so a new PDP release cannot fail
  # CI. Docker pulls by the digest; the tag only names it.
  # Dependabot does not update this. The `e2e (latest PDP image)` job runs the
  # suite against permitio/pdp-v2:latest, so a new release shows up there first.
  # To move the pin, take the version's `digest` from
  # https://hub.docker.com/v2/repositories/permitio/pdp-v2/tags/<version>, and refresh
  # the PDP spec snapshot the API coverage report reads (.github/api-specs/pdp.json;
  # CONTRIBUTING.md, "Moving the PDP pin").
  PINNED_PDP_IMAGE: >-
    permitio/pdp-v2:0.9.16@sha256:e3cf30794ec2d256636b4714641df46e51ee58a3f1f0d24c606e214e0bf8669a

jobs:
  pytest:
    runs-on: ubuntu-24.04
    # A run takes 5-6 minutes, the PDP wait included. The limit stops a hung
    # test from holding a runner for GitHub's default of six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pydantic-version: ['pydantic<2.0.0', 'pydantic>=2.0.0']
        # `include` only attaches extra keys to the two existing entries; it
        # adds no new jobs and leaves the job names below untouched. Each
        # lane installs the matching dependency group from pyproject.toml, so
        # both pydantic resolutions come from uv.lock.
        include:
          - pydantic-version: 'pydantic<2.0.0'
            dependency-group: pydantic-v1
            pydantic-major: '1'
          - pydantic-version: 'pydantic>=2.0.0'
            dependency-group: pydantic-v2
            pydantic-major: '2'
    name: pytest (Pydantic ${{ matrix.pydantic-version }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The uv pinned in the dev group, as locked in uv.lock.
          version-file: "uv.lock"
          # Sets UV_PYTHON, so every uv command below runs on exactly this
          # interpreter (downloaded by uv if the runner does not have it).
          python-version: "3.11.8"
          enable-cache: true
          # The two lanes share uv.lock but install different pydantic
          # majors, so they need separate cache entries.
          cache-suffix: ${{ matrix.dependency-group }}

      # Values reach the shell through env: rather than ${{ }} interpolation
      # into the script body. zizmor flags the interpolated form as
      # template-injection; env-passing is the canonical fix.
      - name: Creation env ${{ env.ENV_NAME }}-${{ github.run_id }}-${{ matrix.pydantic-version }}
        id: create_env
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ENV_NAME: ${{ env.ENV_NAME }}
          RUN_ID: ${{ github.run_id }}
          PYDANTIC_SUFFIX: ${{ matrix.pydantic-version == 'pydantic<2.0.0' && 'v1' || 'v2' }}
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
        run: |
          set -euo pipefail
          ENV_KEY="${ENV_NAME}-${RUN_ID}-${PYDANTIC_SUFFIX}"
          echo "ENV_KEY=$ENV_KEY" >> "$GITHUB_ENV"

          response=$(curl -sS -X POST \
            "https://api.permit.io/v2/projects/${PROJECT_ID}/envs" \
            -H "Authorization: Bearer ${PROJECT_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"key\": \"${ENV_KEY}\", \"name\": \"${ENV_KEY}\"}")

          ENV_ID=$(echo "$response" | jq -r '.id')
          if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "null" ]; then
            echo "::error title=Env creation failed::Could not create the scratch environment."
            exit 1
          fi
          echo "ENV_ID=$ENV_ID" >> "$GITHUB_ENV"
          echo "New env created with key: $ENV_KEY"

      - name: Fetch API_KEY of ${{ env.ENV_KEY }}
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ENV_ID: ${{ env.ENV_ID }}
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X GET \
            "https://api.permit.io/v2/api-key/${PROJECT_ID}/${ENV_ID}" \
            -H "Authorization: Bearer ${PROJECT_API_KEY}")

          ENV_API_KEY=$(echo "$response" | jq -r '.secret')
          if [ -z "$ENV_API_KEY" ] || [ "$ENV_API_KEY" = "null" ]; then
            echo "::error title=API key fetch failed::Could not read the scratch environment's key."
            exit 1
          fi
          # Mask before export so the key can never surface in the job log.
          echo "::add-mask::$ENV_API_KEY"
          echo "ENV_API_KEY=$ENV_API_KEY" >> "$GITHUB_ENV"

      # Started here, NOT as a `services:` container. A service container is
      # created before the first step runs, so the only key available to it is
      # the long-lived PROJECT_API_KEY -- while the tests authenticate with the
      # per-run scratch environment key minted above. The PDP then rejects
      # every decision request with a 403 whose body is plain text, which the
      # SDK surfaces as "cannot connect to the PDP container". That mismatch is
      # why the ReBAC and RBAC decision tests could never pass.
      - name: Start the PDP
        env:
          ENV_API_KEY: ${{ env.ENV_API_KEY }}
          PDP_IMAGE: ${{ env.PINNED_PDP_IMAGE }}
        run: |
          set -euo pipefail
          docker run -d --name permit-pdp \
            -p 7766:7000 \
            -e PDP_API_KEY="${ENV_API_KEY}" \
            -e PDP_DEBUG=true \
            "${PDP_IMAGE}"
          echo "PDP container started; it warms up while dependencies install."

      # --locked fails the job if uv.lock is out of date with pyproject.toml
      # instead of silently re-resolving.
      - name: Install dependencies
        env:
          DEPENDENCY_GROUP: ${{ matrix.dependency-group }}
        run: uv sync --locked --group "${DEPENDENCY_GROUP}"

      - name: Show installed packages
        run: uv pip list

      # Proves the lane runs the pydantic major its name claims. Without it a
      # resolution change could quietly run both lanes on the same major.
      - name: Verify pydantic major
        env:
          EXPECTED_MAJOR: ${{ matrix.pydantic-major }}
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import os
          import sys

          import pydantic

          expected = os.environ["EXPECTED_MAJOR"]
          print(f"python {sys.version.split()[0]}, pydantic {pydantic.VERSION}")
          if str(pydantic.VERSION).split(".")[0] != expected:
              sys.exit(f"expected pydantic {expected}.x, got {pydantic.VERSION}")
          PY

      # Waited for here rather than immediately after `docker run`, so the
      # PDP's bootstrap (fetch config, pull the policy bundle, start OPA)
      # overlaps with dependency installation instead of running after it.
      # The PDP reports 503 on /healthy until its horizon component is up;
      # issuing a check before that fails in a way that looks like a policy
      # bug rather than a timing one. Horizon is up only once the scratch
      # environment's first policy bundle and data have arrived, which has taken
      # 63-154s in CI. Until then the PDP restarts horizon about once a minute.
      - name: Wait for the PDP
        run: |
          set -uo pipefail
          # Bound by elapsed time, not by tries: a probe can take up to 5s.
          while (( SECONDS < 300 )); do
            if curl -sf --max-time 5 http://localhost:7766/healthy > /dev/null 2>&1; then
              echo "PDP healthy after ${SECONDS}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error title=PDP did not become healthy::/healthy never returned 200 within 300s"
          exit 1


      # PERMIT_API_COVERAGE_RECORD makes tests/api_coverage_recorder.py write down every
      # request the tests send. The `API Coverage` job below reads the e2e tests' requests
      # from it, for the operations exercised against the real API and PDP.
      - name: Test with pytest
        env:
          PDP_URL: http://localhost:7766
          API_TIER: prod
          ORG_PDP_API_KEY: ${{ env.ENV_API_KEY }}
          PROJECT_PDP_API_KEY: ${{ env.ENV_API_KEY }}
          PDP_API_KEY: ${{ env.ENV_API_KEY }}
          PERMIT_API_COVERAGE_RECORD: >-
            ${{ runner.temp }}/api-coverage/e2e-${{ matrix.dependency-group }}.jsonl
        run: uv run --no-sync pytest -s --cache-clear tests/

      # The record holds methods and paths only: no query strings, headers or bodies.
      - name: Upload the request record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-e2e-${{ matrix.dependency-group }}
          path: ${{ runner.temp }}/api-coverage/
          retention-days: 7
          if-no-files-found: warn

      # Most of the PDP's log is its once-a-second health checks, which push the
      # startup out of any tail. Drop the GET /health requests and every
      # "Health check failed: horizon" line but the first, which says why the PDP
      # was not healthy. The tail then shows how the policy and data fetches went:
      # response codes, retries, restarts and errors.
      - name: PDP logs
        if: failure()
        run: |
          docker logs permit-pdp 2>&1 \
            | awk '/Health check failed: horizon/ && seen++ {next} !/GET \/health/' \
            | tail -300 || true

      - name: Stop the PDP
        if: always()
        run: docker rm -f permit-pdp || true

      - name: Delete env ${{ env.ENV_KEY }}
        if: always()
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ENV_ID: ${{ env.ENV_ID }}
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
        run: |
          set -uo pipefail
          # Best effort: a failed cleanup must not mask a test failure, but it
          # must still be visible rather than silently leaking an environment.
          if [ -z "${ENV_ID:-}" ] || [ "${ENV_ID}" = "null" ]; then
            echo "::warning::No ENV_ID recorded; nothing to delete."
            exit 0
          fi
          if ! curl -sS -f -X DELETE \
            "https://api.permit.io/v2/projects/${PROJECT_ID}/envs/${ENV_ID}" \
            -H "Authorization: Bearer ${PROJECT_API_KEY}"; then
            echo "::warning title=Scratch env leaked::Failed to delete environment ${ENV_ID}. Delete it by hand."
          fi

  # The e2e tests against PDPs this repository does not pin. CI does not need
  # this job (it is in ADVISORY_JOBS in the Workflow Hardening job), so a new PDP
  # release or a change to the cloud PDP shows up here without blocking a PR.
  # - latest PDP image: the suite against permitio/pdp-v2:latest, on pydantic 2.
  #   Red here with `pytest` green means the newest PDP release behaves unlike
  #   PINNED_PDP_IMAGE.
  # - cloud PDP: tests/test_cloud_pdp_e2e.py against the hosted cloud PDP. Its
  #   tests build a small RBAC policy in the scratch environment, wait for the
  #   cloud PDP to apply it, and assert the exact answers of check, bulk_check,
  #   get_user_permissions and filter_objects. Three more check that
  #   get_user_tenants, permit.pdp_api and the facts methods with
  #   proxy_facts_via_pdp on, whose routes the cloud PDP does not serve, raise
  #   the SDK's error for its 404. The module skips wherever PDP_URL points at
  #   a PDP container (see that module).
  # Each leg makes its own scratch environment, keyed by run, attempt and leg,
  # so it never shares one with a `pytest` lane, the other leg or a re-run.
  e2e-unpinned-pdp:
    name: e2e (${{ matrix.pdp }})
    # Starts once both `pytest` lanes pass, so it never repeats a failure they
    # already report. With them green, a red latest-PDP leg points at the PDP.
    needs: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - pdp: latest PDP image
            env-suffix: pdp-latest
            pdp-image: permitio/pdp-v2:latest
            pdp-url: http://localhost:7766
            tests: tests/
            all-must-run: false
          - pdp: cloud PDP
            env-suffix: cloud-pdp
            # No container: the tests call the hosted PDP.
            pdp-image: ''
            pdp-url: https://cloudpdp.api.permit.io
            tests: tests/test_cloud_pdp_e2e.py
            all-must-run: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: "3.11.8"
          enable-cache: true
          # The entry the pydantic 2 lane of `pytest` saves: the same lock,
          # group and Python, so the same packages.
          cache-suffix: pydantic-v2

      # As in `pytest`, values reach the shell through env:, never ${{ }}.
      - name: Create the scratch environment
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ENV_NAME: ${{ env.ENV_NAME }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ENV_SUFFIX: ${{ matrix.env-suffix }}
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
        run: |
          set -euo pipefail
          ENV_KEY="${ENV_NAME}-${RUN_ID}-${RUN_ATTEMPT}-${ENV_SUFFIX}"
          echo "ENV_KEY=$ENV_KEY" >> "$GITHUB_ENV"

          response=$(curl -sS -X POST \
            "https://api.permit.io/v2/projects/${PROJECT_ID}/envs" \
            -H "Authorization: Bearer ${PROJECT_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"key\": \"${ENV_KEY}\", \"name\": \"${ENV_KEY}\"}")

          ENV_ID=$(echo "$response" | jq -r '.id')
          if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "null" ]; then
            echo "::error title=Env creation failed::Could not create the scratch environment."
            exit 1
          fi
          echo "ENV_ID=$ENV_ID" >> "$GITHUB_ENV"
          echo "New env created with key: $ENV_KEY"

      - name: Fetch the scratch environment's API key
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ENV_ID: ${{ env.ENV_ID }}
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X GET \
            "https://api.permit.io/v2/api-key/${PROJECT_ID}/${ENV_ID}" \
            -H "Authorization: Bearer ${PROJECT_API_KEY}")

          ENV_API_KEY=$(echo "$response" | jq -r '.secret')
          if [ -z "$ENV_API_KEY" ] || [ "$ENV_API_KEY" = "null" ]; then
            echo "::error title=API key fetch failed::Could not read the scratch environment's key."
            exit 1
          fi
          # Mask before export so the key can never surface in the job log.
          echo "::add-mask::$ENV_API_KEY"
          echo "ENV_API_KEY=$ENV_API_KEY" >> "$GITHUB_ENV"

      # Prints the digest :latest resolved to, which names the PDP release a
      # failure here is about (look it up on Docker Hub).
      - name: Start the PDP
        if: matrix.pdp-image != ''
        env:
          ENV_API_KEY: ${{ env.ENV_API_KEY }}
          PDP_IMAGE: ${{ matrix.pdp-image }}
        run: |
          set -euo pipefail
          docker run -d --name permit-pdp \
            -p 7766:7000 \
            -e PDP_API_KEY="${ENV_API_KEY}" \
            -e PDP_DEBUG=true \
            "${PDP_IMAGE}"
          docker image inspect --format '{{join .RepoDigests ", "}}' "${PDP_IMAGE}"

      - name: Install dependencies
        run: uv sync --locked --group pydantic-v2

      - name: Show installed packages
        run: uv pip list

      # The same wait as in `pytest`, for the same reasons.
      - name: Wait for the PDP
        if: matrix.pdp-image != ''
        run: |
          set -uo pipefail
          # Bound by elapsed time, not by tries: a probe can take up to 5s.
          while (( SECONDS < 300 )); do
            if curl -sf --max-time 5 http://localhost:7766/healthy > /dev/null 2>&1; then
              echo "PDP healthy after ${SECONDS}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error title=PDP did not become healthy::/healthy never returned 200 within 300s"
          exit 1

      - name: Test with pytest
        env:
          PDP_URL: ${{ matrix.pdp-url }}
          API_TIER: prod
          ORG_PDP_API_KEY: ${{ env.ENV_API_KEY }}
          PROJECT_PDP_API_KEY: ${{ env.ENV_API_KEY }}
          PDP_API_KEY: ${{ env.ENV_API_KEY }}
          TESTS: ${{ matrix.tests }}
        run: >-
          uv run --no-sync pytest -s --cache-clear
          --junitxml="${RUNNER_TEMP}/junit.xml" "${TESTS}"

      # Cloud leg only. tests/test_cloud_pdp_e2e.py skips itself unless PDP_URL is
      # the cloud PDP. If that check and this leg's PDP_URL ever disagree, every
      # test skips and the leg passes having tested nothing. The whole suite,
      # which the latest-PDP leg runs, has tests that skip by design.
      - name: Check that no test was skipped
        if: matrix.all-must-run
        run: |
          set -euo pipefail
          uv run --no-sync python - "${RUNNER_TEMP}/junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot().find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          if skipped:
              sys.exit(f"{skipped} of {tests} tests were skipped; this leg must run them all")
          print(f"all {tests} tests ran")
          PY

      - name: PDP logs
        if: failure() && matrix.pdp-image != ''
        run: |
          docker logs permit-pdp 2>&1 \
            | awk '/Health check failed: horizon/ && seen++ {next} !/GET \/health/' \
            | tail -300 || true

      - name: Stop the PDP
        if: always() && matrix.pdp-image != ''
        run: docker rm -f permit-pdp || true

      - name: Delete the scratch environment
        if: always()
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ENV_ID: ${{ env.ENV_ID }}
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ENV_ID:-}" ] || [ "${ENV_ID}" = "null" ]; then
            echo "::warning::No ENV_ID recorded; nothing to delete."
            exit 0
          fi
          if ! curl -sS -f -X DELETE \
            "https://api.permit.io/v2/projects/${PROJECT_ID}/envs/${ENV_ID}" \
            -H "Authorization: Bearer ${PROJECT_API_KEY}"; then
            leaked="Failed to delete environment ${ENV_ID}. Delete it by hand."
            echo "::warning title=Scratch env leaked::${leaked}"
          fi

  # The API coverage report (PER-16337, .github/scripts/api_coverage.py): which
  # operations of the control-plane and PDP specs the offline tests send a request
  # to, checked against the snapshots committed under .github/api-specs/ and the
  # allowlist in .github/scripts/api_coverage_allowlist.json. The job summary holds
  # the report, and the api-coverage-report artifact the full result as JSON. Exit 1
  # (a GA operation neither covered nor allowlisted, a stale or changed allowlist
  # entry, an unexplained SDK-only request) and exit 2 (the report did not run) both
  # fail the job. The weekly api-coverage.yml runs it against the live spec.
  api-coverage:
    name: API Coverage
    # Waits for `pytest` only to read its lanes' e2e request records, and runs
    # whether they passed or failed. A fork PR has no secrets, so its `pytest` lanes
    # fail before any test runs: no record, and the e2e column says "not run".
    needs: pytest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: "3.11.8"
          enable-cache: true
          # The entry the pydantic 2 lane of `pytest` saves.
          cache-suffix: pydantic-v2

      - name: Install dependencies
        run: uv sync --locked --group pydantic-v2

      - name: Offline tests with the request recorder
        run: >-
          uv run --no-sync pytest -q -m "not e2e"
          --api-coverage-record "${RUNNER_TEMP}/api-coverage/offline.jsonl"

      # A missing artifact is not an error here: the report says "not run" for the
      # e2e column. NODE_OPTIONS: see the comment job's download step.
      - name: Download the e2e request records
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          pattern: api-coverage-e2e-*
          path: ${{ runner.temp }}/api-coverage/e2e
          merge-multiple: true

      # Runs after a failed offline step too: the report then exits 2, saying the
      # record comes from a failed session, rather than leaving no summary.
      - name: Report
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          e2e_args=()
          for record in "${RUNNER_TEMP}"/api-coverage/e2e/*.jsonl; do
            if [ -f "${record}" ]; then
              e2e_args+=(--e2e-record "${record}")
            fi
          done
          set +e
          uv run --no-sync python .github/scripts/api_coverage.py report \
            --spec control-plane=.github/api-specs/control-plane.json \
            --spec pdp=.github/api-specs/pdp.json \
            --allowlist .github/scripts/api_coverage_allowlist.json \
            --record "${RUNNER_TEMP}/api-coverage/offline.jsonl" \
            "${e2e_args[@]}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json "${RUNNER_TEMP}/api-coverage/report.json"
          report_exit=$?
          set -e
          if [ "${report_exit}" -eq 1 ]; then
            echo "::error title=API coverage::An operation is uncovered and not allowlisted, or the allowlist is out of date. See the job summary."
          elif [ "${report_exit}" -ne 0 ]; then
            echo "::error title=API coverage report did not run::There is no result. See the log."
          fi
          exit "${report_exit}"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-report
          path: ${{ runner.temp }}/api-coverage/
          retention-days: 30
          if-no-files-found: warn

  # Offline suite on every supported Python. It needs no secrets and no PDP, so
  # it also runs on fork PRs.
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # floor: the lowest version of every runtime dependency pyproject.toml
        # allows on that Python, which for pydantic is a pydantic 1 release.
        # pydantic-v2-floor: the same with pydantic held to 2, i.e. the lowest
        # pydantic 2 a consumer can install on that Python.
        # pydantic-v2: what a fresh install gets.
        # Python 3.14 also runs the newest pydantic 1, because it has its own
        # pydantic requirement and pydantic calls v1's 3.14 support minimal.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        deps: [floor, pydantic-v2-floor, pydantic-v2]
        include:
          - python-version: '3.14'
            deps: pydantic-v1
    name: compatibility (Python ${{ matrix.python-version }}, ${{ matrix.deps }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv resolves to the lowest allowed versions, which pip cannot. setup-uv
      # installs the uv pinned in uv.lock, so a new uv release cannot change
      # which floor a leg tests.
      # activate-environment creates .venv on the leg's Python and puts it on
      # PATH, so `uv pip` installs into it and `python` runs from it. No cache:
      # every leg resolves a different set, and a shared entry would hold
      # whichever leg saved first.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      # These legs resolve from the ranges in pyproject.toml, not from uv.lock,
      # because the ranges are what a consumer's installer sees. Installing the
      # package itself (".") reads its dependencies from the metadata uv_build
      # writes, version markers included. --no-sources and --exclude-newer false
      # resolve as a consumer does: the published metadata ignores
      # [tool.uv.sources], and the publish-age cooldown in [tool.uv] applies
      # only to this repository's uv.lock.
      - name: Install dependencies
        env:
          DEPS: ${{ matrix.deps }}
        run: |
          set -euo pipefail
          resolve=(--no-sources --exclude-newer false)
          case "${DEPS}" in
            floor)
              uv pip compile --quiet "${resolve[@]}" --python "$(command -v python)" \
                --resolution lowest-direct pyproject.toml -o "${RUNNER_TEMP}/floor.txt"
              uv pip install "${resolve[@]}" . --group dev -c "${RUNNER_TEMP}/floor.txt"
              ;;
            pydantic-v2-floor)
              echo "pydantic>=2" > "${RUNNER_TEMP}/pydantic-v2.txt"
              uv pip compile --quiet "${resolve[@]}" --python "$(command -v python)" \
                --resolution lowest-direct pyproject.toml -c "${RUNNER_TEMP}/pydantic-v2.txt" \
                -o "${RUNNER_TEMP}/floor.txt"
              grep '^pydantic==' "${RUNNER_TEMP}/floor.txt"
              uv pip install "${resolve[@]}" . --group dev -c "${RUNNER_TEMP}/floor.txt"
              ;;
            pydantic-v1)
              uv pip install "${resolve[@]}" . --group dev "pydantic[email]<2"
              ;;
            pydantic-v2)
              uv pip install "${resolve[@]}" . --group dev "pydantic[email]>=2"
              ;;
            *)
              echo "::error title=Unknown dependency set::${DEPS}"
              exit 1
              ;;
          esac

      - name: Show installed packages
        run: uv pip list

      # Type checkers read permit's annotations only when py.typed is in the
      # installed package, and see the blocking client as blocking only through
      # _sync_types.pyi. Neither is a .py file, so a packaging change can drop
      # them without any import failing. The artifacts are the same on every
      # leg, so one leg builds and checks them: the wheel, and the sdist, since
      # a wheel built from the sdist holds only what the sdist does. Nor may
      # either one ship a package other than permit (permit 2.8.3's wheel
      # installed a top-level `tests` package). The release build in
      # python-sdk-publish.yml runs the same check; keep the two identical.
      - name: Check the wheel and sdist contents
        if: matrix.python-version == '3.14' && matrix.deps == 'pydantic-v2'
        run: |
          set -euo pipefail
          uv build --no-sources --out-dir "${RUNNER_TEMP}/dist"
          python - "${RUNNER_TEMP}/dist" <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          REQUIRED = ["permit/py.typed", "permit/_sync_types.pyi"]


          def check(artifact: Path, names: set[str], found: set[str], allowed: set[str]) -> None:
              missing = [path for path in REQUIRED if path not in names]
              if missing:
                  sys.exit(f"{artifact.name} is missing {missing}")
              unexpected = sorted(found - allowed)
              if unexpected:
                  sys.exit(f"{artifact.name} holds {unexpected}; only {sorted(allowed)} may ship")
              print(f"{artifact.name} ships {' and '.join(REQUIRED)} and no package beside permit")


          dist = Path(sys.argv[1])
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              found = [path.name for path in wheels + sdists]
              sys.exit(f"expected one wheel and one sdist in {dist}, found {found}")
          wheel, sdist = wheels[0], sdists[0]

          # A wheel's top level is what lands in site-packages: permit/ and its
          # permit-<version>.dist-info, named after permit-<version>-<tags>.whl.
          with zipfile.ZipFile(wheel) as wheel_file:
              names = set(wheel_file.namelist())
          dist_info = "-".join(wheel.name.split("-")[:2]) + ".dist-info"
          check(wheel, names, {name.split("/")[0] for name in names}, {"permit", dist_info})

          # Every sdist path starts with its permit-<version>/ directory. Below
          # it, the files are metadata and docs, and the only directory is permit/.
          with tarfile.open(sdist) as sdist_file:
              names = {name.partition("/")[2] for name in sdist_file.getnames()}
          check(sdist, names, {name.split("/")[0] for name in names if "/" in name}, {"permit"})
          PY

      # Every test that needs credentials, the Permit API or a PDP is marked
      # e2e (see [tool.pytest] in pyproject.toml), so `-m "not e2e"` selects
      # everything else. [tool.pytest] also makes every warning an error, so
      # this fails on Python 3.14's deprecation of asyncio.iscoroutinefunction,
      # whether permit or a dependency calls it, and on any warning a floor
      # version of a dependency issues.
      - name: Offline tests
        run: python -m pytest -q -m "not e2e"

  # The migration skill's tests (skills/tests): MIGRATION.md, the skill and its
  # scanner, checked against each other and against the SDK. They run apart from
  # the SDK's suite, with skills/tests/pytest.ini.
  migration-skill:
    name: Migration Skill Tests (pydantic ${{ matrix.pydantic }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pydantic: ['1', '2']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv also provides the Python 3.9 the scanner runs on below.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: '3.12'
          enable-cache: true
          # The two lanes share uv.lock but install different pydantic
          # majors, so they need separate cache entries.
          cache-suffix: pydantic-v${{ matrix.pydantic }}

      # The locked environment the pytest job runs, with the pydantic major this
      # lane names. --locked fails the job if uv.lock is out of date with
      # pyproject.toml instead of silently re-resolving.
      - name: Install dependencies
        env:
          PYDANTIC_MAJOR: ${{ matrix.pydantic }}
        run: uv sync --locked --group "pydantic-v${PYDANTIC_MAJOR}"

      - name: Migration skill tests
        run: uv run --no-sync pytest -q -c skills/tests/pytest.ini skills/tests

      # Customers run the scanner before they move off Python 3.8/3.9, so it
      # must still run there. --no-project keeps the SDK's environment and its
      # requires-python out of it.
      - name: Run the scanner on Python 3.9
        if: matrix.pydantic == '2'
        run: |
          set -euo pipefail
          uv run --no-project --python 3.9 python \
            skills/permit-python-3-migration/scripts/scan.py skills/tests/fixtures/v2_app --json \
            > "${RUNNER_TEMP}/scan.json"
          uv run --no-sync python - "${RUNNER_TEMP}/scan.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1]))
          if not report["findings"]:
              sys.exit("the scanner found nothing in the 2.x sample app on Python 3.9")
          print(f"Python 3.9: {len(report['findings'])} findings")
          PY

  # The API reference site (PER-16775), built from mkdocs.yml with Zensical. The
  # build runs under .github/scripts/check_docs_build.py, which fails the job when
  # the build fails or logs any warning: a broken link or anchor, and the Griffe
  # and mkdocstrings warnings about docstrings, which Zensical's --strict does not
  # count.
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    # A build takes about a minute; the limit stops a hung one.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: "3.11.8"
          enable-cache: true
          # The docs group's tools are in no other job's environment.
          cache-suffix: docs

      # --locked fails the job if uv.lock is out of date with pyproject.toml
      # instead of silently re-resolving.
      - name: Install the docs dependencies
        run: uv sync --locked --group docs

      # Exit 1 is a failed build or a warning, each warning listed at the end of
      # the log; exit 2 means the build did not run to the end. Both fail the job.
      - name: Build the site
        run: |
          set -uo pipefail
          set +e
          uv run --no-sync python .github/scripts/check_docs_build.py
          gate_exit=$?
          set -e
          if [ "${gate_exit}" -eq 1 ]; then
            echo "::error title=Docs build::The site build failed or logged a warning." \
              "The end of the log lists them."
          elif [ "${gate_exit}" -ne 0 ]; then
            echo "::error title=Docs build did not run::The site build did not run to" \
              "the end, so there is no result. See the log."
          fi
          exit "${gate_exit}"

  # These steps do what pre-commit/action v3.0.1 does, written out: its last
  # release pins actions/cache@v4, which targets the deprecated Node 20
  # runtime, and it has had no release since. pre-commit itself comes from
  # uv.lock rather than a pip install.
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: "3.11"
          enable-cache: true

      # Hook environments, keyed on the config that defines them and on the
      # Python they were built with, since a hook venv does not survive an
      # interpreter change. This is the cache pre-commit/action used to provide.
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-py${{ steps.setup-uv.outputs.python-version }}-${{
            hashFiles('.pre-commit-config.yaml') }}

      # pre-commit itself comes from the locked dev group. The ruff, mypy and
      # typos hooks are `repo: local` and run through `uv run --locked`, which
      # syncs .venv to the default groups first: the project, its dependencies
      # (pydantic 2) and the dev tools, so mypy checks against the SDK's real
      # dependencies.
      - name: Run pre-commit
        run: >-
          uv run --locked
          pre-commit run --all-files --show-diff-on-failure --color=always

      # The SDK imports pydantic differently per major, so its types are checked
      # against pydantic 1 as well (the hook above ran against pydantic 2).
      - name: Type-check against pydantic 1
        run: uv run --locked --group pydantic-v1 mypy

  # The dependency audit (.github/actions/dependency-audit), on every PR and
  # every push to main. security.yml runs the same audit weekly.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    # Read-only ON PURPOSE. `uv pip compile` builds an sdist to read its
    # metadata for any dependency without a wheel, which runs that package's
    # setup.py on the runner -- against a dependency list the PR author
    # controls. Holding a `pull-requests: write` GITHUB_TOKEN across that step
    # would hand arbitrary PR-authored code a writable token. The comment is
    # posted by a separate job that has the token but never executes any of
    # this PR's dependency code.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .github/actions/dependency-audit holds the audit's steps. It is a
      # local action, so it runs from the checkout above. zizmor asks for the
      # self-repository syntax ($/...) instead of ./, which actionlint (v1.7.12)
      # rejects.
      - name: Dependency audit
        uses: ./.github/actions/dependency-audit # zizmor: ignore[self-repository]
        with:
          python-version: ${{ env.PYTHON_VERSION }}

  # Holds a write token, and does nothing but download an artifact and post it.
  # It never runs dependency resolution, so PR-authored package code and the
  # writable token never coexist in the same job.
  comment:
    name: Post Audit Comment
    runs-on: ubuntu-24.04
    needs: [audit]
    # always(): the comment matters most when the audit FAILED. The job runs on
    # every event, so it is never skipped, and its steps post only on a pull
    # request from a branch of this repository; elsewhere they are skipped and
    # the job succeeds. Fork PRs get a read-only token, so the post would fail
    # -- they are served by the ::error:: annotations the audit job emits
    # instead. A push has no PR to comment on.
    if: always()
    permissions:
      contents: read
      pull-requests: write
    env:
      SAME_REPO_PR: >-
        ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # NODE_OPTIONS: the unzip library download-artifact v8.0.1 bundles still
      # calls the deprecated Buffer() constructor, so every download prints
      # DEP0005 (actions/download-artifact#484). That is the action's code, not
      # this workflow's, and no newer release exists. This hides DEP0005 alone;
      # drop it once a release stops printing the warning.
      - name: Download audit artifacts
        id: download
        if: env.SAME_REPO_PR == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: dependency-audit
          path: /tmp/audit

      # The script checks the report itself. hashFiles() in `if:` cannot:
      # it ignores every file outside the workspace, so it returns '' for
      # anything under /tmp/audit.
      - name: Comment on PR
        if: env.SAME_REPO_PR == 'true' && steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # listComments is paginated: on a busy PR the marker may not be on
          # page 1, and missing it would post a duplicate comment every run.
          script: |
            const fs = require('fs');
            const REPORT = '/tmp/audit/comment.md';
            const MARKER = '<!-- permit-python:audit:deps -->';
            // GitHub rejects a comment body longer than this.
            const MAX_COMMENT_CHARS = 65536;

            // format_audit.py starts every body it renders with the marker, so
            // a report without it means the render step did not finish.
            let body = fs.existsSync(REPORT) ? fs.readFileSync(REPORT, 'utf8') : '';
            if (!body.startsWith(MARKER)) {
              core.warning(
                `No rendered audit report in the artifact (${REPORT}), so no PR comment ` +
                'was posted. See the Dependency Audit job for what went wrong.'
              );
              return;
            }
            if (body.length > MAX_COMMENT_CHARS) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`;
              core.warning(
                `The audit report is ${body.length} characters, over GitHub's ` +
                `${MAX_COMMENT_CHARS}-character comment limit. The PR comment links to ` +
                'the job summary instead.'
              );
              body = [
                MARKER,
                '',
                '## Dependency Security Audit',
                '',
                `The report is ${body.length} characters, too long for a PR comment ` +
                  `(GitHub allows ${MAX_COMMENT_CHARS}). Read it in the ` +
                  `[job summary](${runUrl}).`,
                '',
              ].join('\n');
            }

            // Nothing cancels the run of a commit the PR has moved past, so it
            // can finish after the run of the new head. Only the run of the PR's
            // current head posts, so the comment never shows an older report.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const auditedSha = context.payload.pull_request.head.sha;
            if (pr.head.sha !== auditedSha) {
              core.notice(
                `This run audited ${auditedSha}, but the PR head is now ${pr.head.sha}. ` +
                'The run of the new head posts its report.'
              );
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            // Match on author AND marker so a human quoting the report can
            // never have their comment overwritten by CI.
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body?.startsWith(MARKER)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Free on public repositories. Flags dependencies a PR *introduces*, which
  # the tree scan above cannot distinguish from ones that were already there,
  # and additionally checks licences.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # The audit scripts decide whether a release ships. Their contract is
  # load-bearing, so it is tested like any other code.
  audit-scripts-test:
    name: Audit Script Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # pytest comes from uv.lock's dev group, so a new pytest release cannot
      # fail this job through .github/scripts/pytest.ini, which turns every
      # warning into an error; -c reads that file rather than the SDK's
      # [tool.pytest] in pyproject.toml. The scripts under test are stdlib only,
      # so --only-dev leaves the project uninstalled. The schema drift check's,
      # the API coverage report's and the docs build gate's tests run here too:
      # they live next to the audit scripts and need no more. So do the tests of
      # the bash of the CI job, the job-list check and the local actions'
      # shellcheck, which also run bash, jq, yq and shellcheck from the runner image.
      - name: Run CI script tests
        run: >-
          uv run --locked --only-dev
          pytest -c .github/scripts/pytest.ini -q
          .github/scripts/test_format_audit.py .github/scripts/test_check_schema_drift.py
          .github/scripts/test_api_coverage.py .github/scripts/test_ci_checks.py
          .github/scripts/test_check_docs_build.py

      - name: Shellcheck the shell scripts
        run: shellcheck .github/scripts/audit-deps.sh scripts/generate_models.sh

  # A CVE gate that runs in a workflow an attacker can rewrite is not a gate.
  workflow-hardening:
    name: Workflow Hardening
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No inputs: the repository has no action.yml, so the runner builds its
      # Dockerfile and runs actionlint with no arguments. actionlint exits 1
      # on any finding, and a non-zero container exit fails the step.
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Findings are uploaded to code scanning by default, which needs
          # Advanced Security. Keep it to the job log and the exit code.
          advanced-security: false
          persona: regular

      # actionlint shellchecks the `run:` blocks of workflows, not those of the
      # local actions under .github/actions. This step shellchecks each of their
      # `shell: bash` steps as actionlint would: every ${{ }} expression replaced
      # by a placeholder, and the checks actionlint turns off left off (SC2154,
      # for one, since `env:` sets variables shellcheck cannot see). Exits 1 on a
      # finding, and 2 when no step is read.
      - name: Shellcheck the local actions
        shell: bash
        env:
          ACTIONS_DIR: .github/actions
        run: |
          status=0
          checked=0
          for action in "$ACTIONS_DIR"/*/action.yml; do
            if ! count=$(yq '.runs.steps | length' "$action"); then
              echo "::error file=$action,title=Shellcheck::Could not read $action."
              exit 2
            fi
            for ((i = 0; i < count; i++)); do
              if [[ $(yq ".runs.steps[$i].shell" "$action") != bash ]]; then
                continue
              fi
              checked=$((checked + 1))
              name=$(yq ".runs.steps[$i].name // \"step $((i + 1))\"" "$action")
              if ! yq ".runs.steps[$i].run" "$action" |
                sed -E 's/\$\{\{[^}]*\}\}/_/g' |
                shellcheck --norc --shell=bash \
                  --exclude=SC1091,SC2043,SC2050,SC2153,SC2154,SC2157,SC2194 -; then
                echo "::error file=$action,title=Shellcheck::Step \"$name\" has the" \
                  "shellcheck findings above."
                status=1
              fi
            done
          done
          if [[ $checked -eq 0 ]]; then
            echo "::error title=Shellcheck::No bash step read from $ACTIONS_DIR/*/action.yml."
            exit 2
          fi
          if [[ $status -eq 0 ]]; then
            echo "Shellcheck found nothing in the $checked bash steps of $ACTIONS_DIR."
          fi
          exit "$status"

      # CI gates only the jobs in its needs, so every other job in this workflow
      # must be listed there or in ADVISORY_JOBS, the jobs that run without
      # gating a PR. Exits 1 when the jobs, CI's needs and ADVISORY_JOBS disagree
      # or CI's EXPECTED_JOBS is not the number of jobs it needs, and 2 when no
      # job is read.
      - name: Check that CI needs every job
        shell: bash
        env:
          WORKFLOW: .github/workflows/test.yml
          # Job ids, separated by spaces.
          # - e2e-unpinned-pdp: the e2e tests against the latest PDP image and the
          #   cloud PDP, which this repository does not pin, so that a new PDP
          #   release shows up there without blocking a PR.
          ADVISORY_JOBS: e2e-unpinned-pdp
        run: |
          export LC_ALL=C
          if ! jobs=$(yq '.jobs | keys | .[] | select(. != "ci")' "$WORKFLOW" | sort) ||
            [[ -z $jobs ]]; then
            echo "::error title=CI needs::No jobs read from $WORKFLOW."
            exit 2
          fi
          needs=$(yq '.jobs.ci.needs[]' "$WORKFLOW" | sort)
          expected=$(yq '.jobs.ci.steps[] | select(.name == "Check the needed jobs") |
            .env.EXPECTED_JOBS' "$WORKFLOW")
          advisory=$(tr -s ' ' '\n' <<<"$ADVISORY_JOBS" | grep . | sort || true)
          status=0
          twice=$(uniq -d <<<"$advisory")
          if [[ -n $twice ]]; then
            echo "::error title=CI needs::ADVISORY_JOBS lists ${twice//$'\n'/, } twice."
            status=1
          fi
          advisory=$(uniq <<<"$advisory")
          stale=$(comm -23 <(echo "$advisory") <(echo "$jobs"))
          if [[ -n $stale ]]; then
            echo "::error title=CI needs::ADVISORY_JOBS lists ${stale//$'\n'/, }," \
              "which is not a job in $WORKFLOW."
            status=1
          fi
          both=$(comm -12 <(echo "$advisory") <(uniq <<<"$needs"))
          if [[ -n $both ]]; then
            echo "::error title=CI needs::CI needs ${both//$'\n'/, }, which ADVISORY_JOBS" \
              "lists as not gating a PR."
            status=1
          fi
          gated=$(comm -23 <(echo "$jobs") <(echo "$advisory"))
          if [[ $gated != "$needs" ]]; then
            echo "::error title=CI needs::CI's needs must list every job in $WORKFLOW" \
              "but CI and ADVISORY_JOBS, once each. Add a new job to CI's needs and" \
              "change EXPECTED_JOBS, or list it in ADVISORY_JOBS with the reason."
            diff <(echo "$gated") <(echo "$needs") || true
            status=1
          fi
          count=$(grep -c . <<<"$needs" || true)
          if [[ $expected != "$count" ]]; then
            echo "::error title=CI needs::EXPECTED_JOBS in the CI job is ${expected:-not set}," \
              "but CI needs $count jobs."
            status=1
          fi
          if [[ $status -eq 0 ]]; then
            echo "CI needs every job but the advisory ones (${advisory//$'\n'/, }):" \
              "${needs//$'\n'/, }."
          fi
          exit "$status"

  # The one check to require. It runs whatever happened to the jobs it needs, since
  # GitHub counts a skipped required check as passing, and fails unless each of them
  # succeeded: a failed, cancelled or skipped job fails it. The audit comment job
  # succeeds with its steps skipped where it cannot post. The one exception is
  # dependency review, which runs on pull requests only: on a push its job is
  # skipped and that passes; on a pull request it must succeed. CI does not need
  # e2e-unpinned-pdp, which reports on PDPs this repository does not pin.
  # Exits 1 when a job did not succeed, and 2 when the results of fewer or more than
  # EXPECTED_JOBS jobs arrive. Change EXPECTED_JOBS when you change needs. The
  # Workflow Hardening job fails when a job is in neither needs nor its
  # ADVISORY_JOBS, or when EXPECTED_JOBS is not the number of jobs in needs.
  # Until the ruleset on main requires CI alone, it requires the check names of
  # six jobs here, so do not rename those jobs until then (a required check that
  # never reports leaves every pull request waiting):
  # "pytest (Pydantic pydantic<2.0.0)", "pytest (Pydantic pydantic>=2.0.0)",
  # "pre-commit", "Dependency Audit", "Audit Script Tests", "Workflow Hardening".
  ci:
    name: CI
    if: always()
    needs:
      - api-coverage
      - audit
      - audit-scripts-test
      - comment
      - compatibility
      - dependency-review
      - docs
      - migration-skill
      - pre-commit
      - pytest
      - workflow-hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the needed jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          EXPECTED_JOBS: 11
        run: |
          if ! results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS"); then
            echo "::error title=CI::Could not read the job results."
            exit 2
          fi
          printf '%s\n' "$results"
          count=$(grep -c . <<<"$results" || true)
          if [[ $count -ne $EXPECTED_JOBS ]]; then
            echo "::error title=CI::${count} job results, expected ${EXPECTED_JOBS}."
            exit 2
          fi
          failed=$(grep -v ' success$' <<<"$results" || true)
          if [[ $EVENT == push ]]; then
            failed=$(grep -vx 'dependency-review skipped' <<<"$failed" || true)
          fi
          if [[ -n $failed ]]; then
            echo "::error title=CI::Jobs that did not succeed: ${failed//$'\n'/, }"
            exit 1
          fi
