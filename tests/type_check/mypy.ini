# How tests/test_typing_surface.py type-checks consumer.py: the way a user's project
# sees an installed permit. There is deliberately no pydantic plugin, because users
# must not need one. strict and the deprecated error code are the strictest settings a
# user may run. strict includes warn_unused_ignores and no_implicit_reexport, which only
# counts names a module exports explicitly. The deprecated code, off by default, reports
# names marked deprecated (PEP 702).
[mypy]
strict = True
enable_error_code = deprecated

# mypy does not report errors inside an installed package to its users. permit is
# checked here from the source tree, so hide its own errors the same way, including
# those in its .pyi stub, which mypy otherwise always reports.
[mypy-permit.*]
follow_imports = silent
follow_imports_for_stubs = True
