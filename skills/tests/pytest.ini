[pytest]
# The migration skill's tests run apart from the SDK's suite, with these settings
# instead of the [tool.pytest] table in the repository's pyproject.toml. See README.md.
testpaths = .
# strict_config, strict_markers, strict_xfail and strict_parametrization_ids.
strict = true
# Any warning fails the test that raised it, as in the SDK's suite, except the warning
# `import permit` issues on pydantic 1 on purpose.
filterwarnings =
    error
    ignore:Support for pydantic 1 is deprecated:DeprecationWarning
